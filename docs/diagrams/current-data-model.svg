<g id="system-campaign-relationship" data-from="systems" data-to="campaigns" data-field="system_id" data-parent-count="1" data-child-count="0..*">
<path d="M458 318 H842" class="relation"/>
<text x="477" y="306" class="multiplicity">1</text><text x="787" y="306" class="multiplicity">0..*</text>
<text x="572" y="295" class="relationship-label">default system</text>
</g>
<g id="system-session-relationship" data-from="systems" data-to="sessions" data-field="system_id" data-parent-count="1" data-child-count="0..*">
<path d="M458 404 H600 V948 H842" class="relation"/>
<text x="477" y="393" class="multiplicity">1</text><text x="787" y="936" class="multiplicity">0..*</text>
<text x="616" y="577" class="relationship-label">actual system</text>
<text x="616" y="603" class="note">May differ from</text><text x="616" y="627" class="note">campaign default</text>
</g>
<g id="campaign-session-relationship" data-from="campaigns" data-to="sessions" data-field="campaign_id" data-parent-count="0..1" data-child-count="0..*">
<path d="M1077 540 V650" class="relation"/>
<text x="1093" y="565" class="multiplicity">0..1</text><text x="1093" y="638" class="multiplicity">0..*</text>
<text x="862" y="600" class="relationship-label">optional campaign</text>
</g>

<text x="48" y="507" class="note-title">Campaign defaults ≠ session values</text>
<text x="48" y="536" class="note">A session stores its actual GM, system and link.</text>
<text x="48" y="562" class="note">Changing defaults does not rewrite past entries.</text>
<text x="48" y="622" class="note-title">One-shots share the sessions table</text>
<text x="48" y="651" class="note">No campaign; the API requires a nonblank name.</text>
<text x="48" y="677" class="note">Campaign-session names are cleared by the API.</text>
<text x="48" y="960" class="note">At most one settings row: id = 1.</text>
<text x="48" y="986" class="note">GM names are text, not person-table references.</text>
<text x="48" y="1012" class="note">Settings do not represent a user account.</text>

<path d="M48 1100 H1312" class="divider"/>
<text x="48" y="1130" class="footer">Source: main.py · 4e56ef7 · See models.md for field notes and database-versus-application constraints.</text>
<text x="48" y="1156" class="footer">No planned fields shown. Source review does not establish runtime behavior or close recovery-design work.</text>
</svg>
