<path d="M842 752 H1312" class="divider"/>
<g data-field="id"><text x="862" y="777" class="field">id</text><text x="1090" y="777" class="type">integer</text><text x="1220" y="777" class="key">PK</text></g>
<g data-field="campaign_id"><text x="862" y="811" class="field">campaign_id</text><text x="1090" y="811" class="type">integer ?</text><text x="1220" y="811" class="key">FK</text></g>
<g data-field="name"><text x="862" y="845" class="field">name</text><text x="1090" y="845" class="type">text ?</text></g>
