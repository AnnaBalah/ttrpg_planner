<text x="68" y="769" class="table-name">tracker_settings</text>
<text x="68" y="794" class="table-purpose">Shared dataset settings · no relationships</text>
<text x="68" y="831" class="column-title">FIELD</text><text x="285" y="831" class="column-title">TYPE</text><text x="378" y="831" class="column-title">KEY</text>
<path d="M48 842 H458" class="divider"/>
<g data-field="id"><text x="68" y="867" class="field">id</text><text x="285" y="867" class="type">integer</text><text x="378" y="867" class="key">PK</text></g>
