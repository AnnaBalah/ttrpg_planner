<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1180" viewBox="0 0 1360 1180" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Tablelog: current data model</title>
<desc id="diagram-description">All 22 stored fields in four tables. Each campaign has one default system; each session has one actual system and optionally one campaign. Each system or campaign may have zero or many related records. Tracker settings has at most one independent row. Question marks mark nullable fields. The diagram documents source at commit 4e56ef7, not runtime verification.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#1e293b}
.title{font-size:28px;font-weight:650}
.subtitle{font-size:18px;fill:#526277}
.table-name{font-family:Consolas,'Courier New',monospace;font-size:22px;font-weight:650}
.table-purpose{font-size:16px;fill:#526277}
.column-title{font-size:14px;font-weight:650;fill:#526277}
.field{font-family:Consolas,'Courier New',monospace;font-size:17px}
.type{font-size:16px;fill:#526277}
.key{font-size:15px;font-weight:650;fill:#245b80}
.card{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
.heading{fill:#eff6ff}
.settings-heading{fill:#ecfdf5}
.divider{stroke:#e2e8f0;stroke-width:1}
.relation{fill:none;stroke:#475569;stroke-width:2}
.multiplicity{font-size:18px;font-weight:650;fill:#334155}
.relationship-label{font-size:17px;fill:#475569}
.note-title{font-size:18px;font-weight:650}
.note{font-size:17px;fill:#526277}
.footer{font-size:16px;fill:#526277}
</style>
<rect width="1360" height="1180" fill="#fff"/>
<text x="48" y="47" class="title">Tablelog · Current data model</text>
<text x="48" y="79" class="subtitle">Existing stored data · 4 tables · 22 fields · Source reviewed 28 October 2026</text>
<text x="48" y="112" class="footer">PK primary key · FK foreign key · UQ database uniqueness · ? nullable · Types show integer/text values</text>
<text x="48" y="138" class="footer">1 exactly one · 0..1 optional one · 0..* zero or more</text>

