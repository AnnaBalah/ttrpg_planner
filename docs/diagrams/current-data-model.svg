<text x="68" y="219" class="table-name">systems</text>
<text x="68" y="244" class="table-purpose">Reusable game systems</text>
<text x="68" y="281" class="column-title">FIELD</text><text x="285" y="281" class="column-title">TYPE</text><text x="378" y="281" class="column-title">KEY</text>
<path d="M48 292 H458" class="divider"/>
<g data-field="id"><text x="68" y="317" class="field">id</text><text x="285" y="317" class="type">integer</text><text x="378" y="317" class="key">PK</text></g>
<g data-field="name"><text x="68" y="351" class="field">name</text><text x="285" y="351" class="type">text</text><text x="378" y="351" class="key">UQ</text></g>
<g data-field="color"><text x="68" y="385" class="field">color</text><text x="285" y="385" class="type">text</text></g>
<g data-field="created_at"><text x="68" y="419" class="field">created_at</text><text x="285" y="419" class="type">text</text></g>
</g>

