<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1140" viewBox="0 0 1840 1140" role="img" aria-labelledby="title description">
<title id="title">WF-CS-02 · One transaction for campaign and first session</title>
<desc id="description">BPMN v0.2. Validate and save related changes in one server transaction. Distinguish confirmed commit, confirmed rollback and unknown save or rollback results. The caller handles form reset and feedback under Q-SH-01.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1e293b}.title{font-size:27px;font-weight:650}.subtitle,.label{font-size:18px;fill:#526277}.node-text{font-size:18px}.flow{fill:none;stroke:#475569;stroke-width:1.8;marker-end:url(#arrow)}.task{fill:white;stroke:#475569;stroke-width:1.8}.event{fill:white;stroke:#475569}.note{font-size:18px;fill:#526277}</style>
<rect width="1840" height="1140" fill="white"/>
<text x="30" y="45" class="title" text-anchor="start"><tspan x="30" dy="0">WF-CS-02 · One transaction for campaign and first session</tspan></text>
<text x="30" y="80" class="subtitle" text-anchor="start"><tspan x="30" dy="0">BPMN v0.2 · intended behavior aligned with Q-SH-01 · existing game system</tspan></text>
<rect x="30" y="150" width="1780" height="860" fill="white" stroke="#94a3b8"/><path d="M60 150 V1010" stroke="#94a3b8"/>
<text transform="translate(51 580) rotate(-90)" class="label" text-anchor="middle">Tablelog · server save and returned outcome</text>
<path id="D01" data-source="Start_Pair" data-target="Validate_Pair" class="flow" d="M156 270 L220 270"/>
<path id="D02" data-source="Validate_Pair" data-target="Save_Atomic_Pair" class="flow" d="M540 270 L620 270"/>
<path id="D03" data-source="Save_Atomic_Pair" data-target="Atomic_Result" class="flow" d="M1000 270 L1120 270"/>
<path id="D04" data-source="Atomic_Result" data-target="End_Pair_Saved" class="flow" d="M1170 270 L1430 270"/>
<path id="D05" data-source="Atomic_Result" data-target="Pair_Failure" class="flow" d="M1145 295 L1145 430 L905 430 L905 500"/>
<path id="D06" data-source="Pair_Failure" data-target="End_Pair_Failed" class="flow" d="M905 600 L905 692"/>
<path id="D07" data-source="Atomic_Result" data-target="Pair_Unknown" class="flow" d="M1145 245 L1145 180 L1520 180 L1520 500"/>
<path id="D08" data-source="Pair_Unknown" data-target="End_Pair_Unknown" class="flow" d="M1520 600 L1520 692"/>
<g id="Start_Pair" data-bpmn-kind="startEvent">
<circle cx="138.0" cy="270.0" r="18.0" class="event" stroke-width="1.8"/>
<text x="138.0" y="323" class="label" text-anchor="middle"><tspan x="138.0" dy="0">Start save attempt</tspan></text>
</g>
<g id="Validate_Pair" data-bpmn-kind="task">
<rect x="220" y="220" width="320" height="100" rx="12" class="task"/>
<text x="380.0" y="264.0" class="node-text" text-anchor="middle"><tspan x="380.0" dy="0">Validate both records</tspan><tspan x="380.0" dy="24">Derive campaign defaults</tspan></text>
</g>
<g id="Save_Atomic_Pair" data-bpmn-kind="task">
<rect x="620" y="210" width="380" height="120" rx="12" class="task"/>
<text x="810.0" y="252.0" class="node-text" text-anchor="middle"><tspan x="810.0" dy="0">One server transaction</tspan><tspan x="810.0" dy="24">Save campaign + first session</tspan><tspan x="810.0" dy="24">Commit together or roll back</tspan></text>
</g>
<g id="Atomic_Result" data-bpmn-kind="exclusiveGateway">
<polygon points="1145.0,245 1170,270.0 1145.0,295 1120,270.0" fill="white" stroke="#475569" stroke-width="1.8"/><path d="M1138.0 263.0 L1152.0 277.0 M1138.0 277.0 L1152.0 263.0" stroke="#475569" stroke-width="2"/>
<text x="1145.0" y="217" class="label" text-anchor="middle"><tspan x="1145.0" dy="0">Transaction result?</tspan></text>
</g>
<g id="End_Pair_Saved" data-bpmn-kind="endEvent">
<circle cx="1448.0" cy="270.0" r="18.0" class="event" stroke-width="3.8"/>
<text x="1448.0" y="323" class="label" text-anchor="middle"><tspan x="1448.0" dy="0">Both records saved</tspan></text>
</g>
<g id="Pair_Failure" data-bpmn-kind="task">
<rect x="730" y="500" width="350" height="100" rx="12" class="task"/>
<text x="905.0" y="532.0" class="node-text" text-anchor="middle"><tspan x="905.0" dy="0">Return confirmed failure</tspan><tspan x="905.0" dy="24">No new campaign or session</tspan><tspan x="905.0" dy="24">Earlier records unchanged</tspan></text>
</g>
<g id="End_Pair_Failed" data-bpmn-kind="endEvent">
<circle cx="905.0" cy="710.0" r="18.0" class="event" stroke-width="3.8"/>
<text x="905.0" y="763" class="label" text-anchor="middle"><tspan x="905.0" dy="0">Confirmed failure</tspan><tspan x="905.0" dy="24">No partial changes</tspan></text>
</g>
<g id="Pair_Unknown" data-bpmn-kind="task">
<rect x="1320" y="500" width="400" height="100" rx="12" class="task"/>
<text x="1520.0" y="532.0" class="node-text" text-anchor="middle"><tspan x="1520.0" dy="0">Return unknown save result</tspan><tspan x="1520.0" dy="24">or unconfirmed rollback</tspan><tspan x="1520.0" dy="24">Never automatically repeat or undo</tspan></text>
</g>
<g id="End_Pair_Unknown" data-bpmn-kind="endEvent">
<circle cx="1520.0" cy="710.0" r="18.0" class="event" stroke-width="3.8"/>
<text x="1520.0" y="763" class="label" text-anchor="middle"><tspan x="1520.0" dy="0">Outcome unknown</tspan><tspan x="1520.0" dy="24">No cleanup-success claim</tspan></text>
</g>
<text x="1300" y="248" class="label" text-anchor="middle"><tspan x="1300" dy="0">Commit confirmed</tspan></text>
<text x="995" y="410" class="label" text-anchor="middle"><tspan x="995" dy="0">Rollback confirmed</tspan></text>
<text x="1410" y="159" class="label" text-anchor="middle"><tspan x="1410" dy="0">Unknown result</tspan></text>
<text x="110" y="875" class="note" text-anchor="start"><tspan x="110" dy="0">Q-CS-05 · Campaign defaults</tspan><tspan x="110" dy="24">Use explicit default GM, otherwise session GM.</tspan><tspan x="110" dy="24">Use the first session system and optional link.</tspan></text>
<text x="910" y="875" class="note" text-anchor="start"><tspan x="910" dy="0">Q-SH-01 · Caller handles form and feedback</tspan><tspan x="910" dy="24">Confirmed failure or uncertainty closes/resets and discards input.</tspan><tspan x="910" dy="24">Unknown result proves neither unchanged data nor successful rollback.</tspan></text>
<text x="30" y="1060" class="subtitle" text-anchor="start"><tspan x="30" dy="0">Circle: start/end · rounded box: task · diamond X: exclusive choice · solid arrow: sequence flow</tspan></text>
<text x="30" y="1095" class="subtitle" text-anchor="start"><tspan x="30" dy="0">The caller never repeats or undoes a confirmed/unknown save automatically. Implementation and runtime verification remain open.</tspan></text>
</svg>
