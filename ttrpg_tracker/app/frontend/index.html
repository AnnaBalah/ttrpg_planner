<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TTRPG Tracker</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Session Log</p>
        <h1>TTRPG Tracker</h1>
      </div>
      <div class="summary" aria-live="polite">
        <span id="session-count">0</span>
        <span>sessions</span>
      </div>
    </header>

    <main>
      <nav class="tabs" aria-label="App sections">
        <button class="tab-button is-active" type="button" data-tab="sessions">Sessions</button>
        <button class="tab-button" type="button" data-tab="campaigns">Campaigns</button>
        <button class="tab-button" type="button" data-tab="systems">Systems</button>
      </nav>

      <section class="quick-add" aria-label="Campaign quick add">
        <div class="section-heading">
          <h2>Quick Add</h2>
          <button class="primary" id="add-session" type="button">+ Session</button>
        </div>
        <div class="quick-grid" id="quick-add-list"></div>
      </section>

      <section class="panel is-active" id="sessions-panel" data-panel="sessions">
        <div class="section-heading">
          <h2>Sessions</h2>
          <p id="status">Loading...</p>
        </div>
        <div class="toolbar" aria-label="Session filters">
          <label>
            Search
            <input id="search" type="search" placeholder="Campaign, GM, or system" />
          </label>
          <label>
            Campaign
            <select id="campaign-filter"></select>
          </label>
          <label>
            GM
            <select id="gm-filter"></select>
          </label>
          <label>
            System
            <select id="system-filter"></select>
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><button type="button" data-sort="date">Date</button></th>
                <th><button type="button" data-sort="display_name">Campaign / One-shot</button></th>
                <th><button type="button" data-sort="gm">GM</button></th>
                <th><button type="button" data-sort="system_name">System</button></th>
                <th>Kind</th>
                <th>Link</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="sessions-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="campaigns-panel" data-panel="campaigns">
        <div class="section-heading">
          <h2>Campaigns</h2>
          <p id="campaign-status">Templates</p>
        </div>
        <form class="editor" id="campaign-form">
          <input type="hidden" id="campaign-id" />
          <label>
            Name
            <input id="campaign-name" required />
          </label>
          <label>
            Default GM
            <input id="campaign-gm" list="gm-options" required />
          </label>
          <label>
            System
            <select id="campaign-system" required></select>
          </label>
          <label>
            Default link
            <input id="campaign-link" type="url" />
          </label>
          <label class="checkbox">
            <input id="campaign-archived" type="checkbox" />
            Archived
          </label>
          <div class="form-actions">
            <button class="primary" type="submit">Save Campaign</button>
            <button type="button" id="clear-campaign">Clear</button>
          </div>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>GM</th>
                <th>System</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="campaigns-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="systems-panel" data-panel="systems">
        <div class="section-heading">
          <h2>Systems</h2>
          <p id="system-status">Managed list</p>
        </div>
        <form class="editor editor-compact" id="system-form">
          <input type="hidden" id="system-id" />
          <label>
            Name
            <input id="system-name" required />
          </label>
          <label>
            Primary color
            <input id="system-color" type="color" value="#58b6a9" required />
          </label>
          <div class="form-actions">
            <button class="primary" type="submit">Save System</button>
            <button type="button" id="clear-system">Clear</button>
          </div>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Color</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="systems-body"></tbody>
          </table>
        </div>
      </section>

      <section class="export-bar" aria-label="Backup export">
        <button type="button" id="export-json">Export JSON</button>
        <button type="button" id="export-csv">Export CSV</button>
      </section>
    </main>

    <dialog id="session-dialog">
      <form method="dialog" class="modal" id="session-form">
        <div class="section-heading">
          <h2 id="session-dialog-title">Session</h2>
          <button class="icon-button" type="button" id="close-session" aria-label="Close">x</button>
        </div>

        <input type="hidden" id="session-id" />

        <label>
          Type
          <select id="session-kind">
            <option value="campaign">Campaign session</option>
            <option value="one-shot">One-shot</option>
            <option value="new-campaign">New campaign</option>
          </select>
        </label>

        <div class="field-group" data-session-group="campaign">
          <label>
            Campaign
            <select id="session-campaign"></select>
          </label>
        </div>

        <div class="field-group" data-session-group="one-shot">
          <label>
            One-shot name
            <input id="session-name" />
          </label>
        </div>

        <div class="field-group" data-session-group="new-campaign">
          <label>
            Campaign name
            <input id="session-new-campaign-name" />
          </label>
          <label>
            Default GM
            <input id="session-new-campaign-gm" list="gm-options" />
          </label>
        </div>

        <div class="form-grid">
          <label>
            Date
            <input id="session-date" type="date" required />
          </label>
          <label>
            GM
            <input id="session-gm" list="gm-options" required />
          </label>
          <label>
            System
            <select id="session-system" required></select>
          </label>
          <div class="field-group" id="session-new-system-fields">
            <label>
              New system
              <input id="session-new-system-name" />
            </label>
            <label>
              Primary color
              <input id="session-new-system-color" type="color" value="#7d91e8" />
            </label>
          </div>
          <label>
            Link
            <input id="session-link" type="url" />
          </label>
          <label>
            Notes
            <textarea id="session-notes" rows="3"></textarea>
          </label>
        </div>

        <div class="form-actions">
          <button class="primary" type="submit">Save Session</button>
          <button type="button" id="delete-session">Delete</button>
        </div>
      </form>
    </dialog>

    <datalist id="gm-options"></datalist>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
